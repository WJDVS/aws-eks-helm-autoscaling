replicaCount: 1

wordpress:
  image: "wordpress:6.7-apache"
  containerPort: 80
  serviceType: ClusterIP
  authKeysSecretName: wordpress-auth-keys
  persistence:
    enabled: true
    name: wordpress-pvc
    storageClassName: gp3
    accessMode: ReadWriteOnce
    size: 10Gi
    mountPath: /var/www/html
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

mysql:
  image: "mysql:8.0"
  containerPort: 3306
