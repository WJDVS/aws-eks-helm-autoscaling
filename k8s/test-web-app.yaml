apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-web-app
  namespace: wordpress
  labels:
    app: test-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-web
  template:
    metadata:
      labels:
        app: test-web
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: test-web-service
  namespace: wordpress
spec:
  type: ClusterIP
  selector:
    app: test-web
  ports:
  - port: 80
    targetPort: 80
